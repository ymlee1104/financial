<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 스마트폰에서 화면이 잘리거나 임의로 확대되는 것을 방지하기 위한 뷰포트 설정 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>현금흐름 보기</title>

<!-- 아이콘 설정 추가 -->
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="shortcut icon" href="icon.png">  
  
<style>
  @font-face {
    font-family: 'Google Sans';
    src: url('https://fonts.gstatic.com/s/googlesans/v58/4UaRrENHsxJlGDuGo1OIlJfC6l_24rlCK1Yo_Iq2vgCI.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght,ROND@100..900,0..100&display=swap');

  :root {
    --ff-sans: 'Google Sans Flex', 'Google Sans', 'Open Sans', 'Noto Sans KR', sans-serif;
    --fw-medium: 500;
    --surface: #fdfcfc;
    --surface-bright: #ffffff;
    --surface-container: #f2f0f0;
    --on-surface-default: #1f1f1f;
    --on-surface-de-emphasis: #444746;
    --stroke-default: #e3e3e3;
    --positive: #008052;
    --negative: #de2d29;
    
    /* 차트 색상 정의 */
    --chart-1: #3186ff;
    --chart-2: #60d673;
    --chart-3: #ffdb0f;
    --chart-4: #ff8585;
    --chart-5: #969dff;
    --chart-6: #ff88d3;
    --tertiary: #0ebc5f;
    --secondary: #969dff;
    --warning: #ffdb0f;
  }

  body {
    font-family: var(--ff-sans);
    background: var(--surface);
    color: var(--on-surface-default);
    padding: 0; margin: 0;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .widget {
    width: 100%;
    box-sizing: border-box;
    margin: 0 auto;
    padding: 12px 10px 16px;
  }

  /* 상단 총 소득 요약 영역 */
  .summary-section {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }
  .summary-item { text-align: center; }
  .summary-val {
    font-family: 'Google Sans Flex', var(--ff-sans);
    font-weight: var(--fw-medium);
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
  }
  .center-val { font-size: 32px; line-height: 1.2; color: var(--positive); }
  .summary-sub { font-size: 13px; color: var(--on-surface-de-emphasis); margin-top: 2px; }

  /* 차트 영역 */
  .chart-section { width: 100%; overflow: visible; }
  .chart-section svg { display: block; width: 100%; height: auto; }

  /* 슬라이더 제어 영역 */
  .sliders-section { margin-top: 12px; }
  .breakdown-title { font-size: 16px; font-weight: var(--fw-medium); margin-bottom: 8px; }
  
  /* 2열 레이아웃 강제 유지 */
  .slider-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 12px 10px;
  }
  
  .slider-row { margin-bottom: 0; }
  .slider-label {
    font-size: 12px;
    color: var(--on-surface-de-emphasis);
    margin-bottom: 4px;
    white-space: normal;
    line-height: 1.2;
    display: flex;
    align-items: center;
  }
  .color-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 4px; flex-shrink: 0;
  }
  
  /* 슬라이더와 텍스트 박스 간격 소폭 축소 */
  .slider-control { display: flex; align-items: center; gap: 4px; }
  
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 3px; background: transparent;
    border-radius: 999px; outline: none;
    min-width: 0; /* 넘침 방지 */
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 3px;
    background: linear-gradient(to right, var(--on-surface-default) var(--progress, 50%), rgba(128,128,128,0.3) var(--progress, 50%));
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 20px; border-radius: 999px;
    background: var(--surface); border: 2px solid var(--on-surface-default);
    margin-top: -8.5px;
  }

  /* 금액 텍스트 박스 폭 축소 및 중앙 정렬 적용 */
  .slider-value {
    font-size: 11px; font-weight: var(--fw-medium);
    width: 56px; flex-shrink: 0; text-align: center;
    background: var(--surface-container); color: var(--on-surface-default);
    padding: 4px 6px; border-radius: 6px;
    border: 1px solid rgba(128,128,128,0.2);
    box-sizing: border-box;
  }

  .footer-note {
    margin-top: 12px; font-size: 11px; text-align: center;
    color: var(--on-surface-de-emphasis);
  }

  /* SVG 내부 텍스트 스타일 */
  .node-label { font-family: var(--ff-sans); fill: var(--on-surface-default); }

  /* Galaxy A34 및 모바일 환경 최적화 */
  @media (max-width: 480px) {
    .center-val { font-size: 28px; }
    .slider-label { font-size: 11px; }
    .breakdown-title { font-size: 15px; }
    /* 모바일에서 금액 박스 폭 대폭 축소, 그리드 간격 좁힘 */
    .slider-value { font-size: 10px; width: 48px; padding: 4px 2px; }
    .slider-grid { gap: 12px 6px; } 
  }
</style>
</head>
<body>

<div class="widget" id="sankeyWidget">
  <!-- 요약 금액 (상단) -->
  <div class="summary-section">
    <div class="summary-item center-item">
      <div class="summary-val center-val positive" id="heroValue">₩0</div>
      <div class="summary-sub" id="heroSubtitle">예상 현금흐름/월(2030년 기준)</div>
    </div>
  </div>

  <!-- 차트 (중앙) -->
  <div class="chart-section">
    <svg id="sankeyChart" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <!-- 슬라이더 조절기 (하단) -->
  <div class="sliders-section">
    <div class="breakdown-title">항목별 현금흐름 조정</div>
    <div id="slidersContainer" class="slider-grid"></div>
  </div>

  <div class="footer-note">슬라이더를 드래그하여 월간 현금흐름의 변화를 확인하세요.</div>
</div>

<script>
  // 사용자 설정 데이터 주입
  const injectedData = {
    "heroMode": "total_income",
    "labels": { "currencySymbol": "₩" },
    "nodes": [
      { "key": "total_income", "label": "총 노후 소득", "type": "income", "parent": null, "colorVar": "--chart-1" },
      { "key": "solar", "label": "태양광 발전 수익", "value": 4000000, "type": "income", "parent": "total_income", "colorVar": "--chart-2", "slider": { "min": 0, "max": 9990000, "step": 10000 } },
      { "key": "dividend", "label": "월 배당 수익", "value": 2500000, "type": "income", "parent": "total_income", "colorVar": "--chart-6", "slider": { "min": 0, "max": 9990000, "step": 10000 } },
      { "key": "nps_husband", "label": "국민연금(본인)", "value": 1720000, "type": "income", "parent": "total_income", "colorVar": "--chart-3", "slider": { "min": 0, "max": 5000000, "step": 10000 } },
      { "key": "nps_wife", "label": "국민연금(아내)", "value": 760000, "type": "income", "parent": "total_income", "colorVar": "--chart-4", "slider": { "min": 0, "max": 5000000, "step": 10000 } },
      { "key": "housing", "label": "주택연금", "value": 2000000, "type": "income", "parent": "total_income", "colorVar": "--chart-5", "slider": { "min": 0, "max": 5000000, "step": 10000 } },
      { "key": "salary", "label": "급여소득", "value": 3500000, "type": "income", "parent": "total_income", "colorVar": "--tertiary", "slider": { "min": 0, "max": 9990000, "step": 10000 } },
      { "key": "irp", "label": "개인 IRP 출금", "value": 100000, "type": "income", "parent": "total_income", "colorVar": "--secondary", "slider": { "min": 0, "max": 1000000, "step": 10000 } },
      { "key": "dc", "label": "퇴직연금 DC 출금", "value": 150000, "type": "income", "parent": "total_income", "colorVar": "--warning", "slider": { "min": 0, "max": 2000000, "step": 10000 } }
    ]
  };

  const nodeDataList = injectedData.nodes;
  let nodeMap = {};
  let incomeRoots = [];
  let allVisibleNodes = [];
  let totalIn = 0;

  // 모바일 화면 크기에 맞춘 동적 변수 세팅
  let SVG_W = window.innerWidth > 0 ? window.innerWidth - 20 : 392; 
  let SVG_H = 300;
  let PAD = { top: 10, bottom: 10, left: 95, right: 15 }; 
  const NODE_GAP = 8;
  const FLOW_OPACITY = 0.38;

  // 숫자를 만원 단위로 표기하도록 함수 변경
  function fmt(n) { 
    if (n >= 10000) {
      return '₩' + (n / 10000).toLocaleString('ko-KR') + '만';
    }
    return '₩' + n.toLocaleString('ko-KR'); 
  }

  function getComputedColor(varName) {
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }

  function updateSliderProgress(el) {
    const min = parseFloat(el.min) || 0, max = parseFloat(el.max) || 100, val = parseFloat(el.value) || 0;
    el.style.setProperty('--progress', ((val - min) / (max - min) * 100) + '%');
  }

  function buildTree() {
    nodeMap = {}; incomeRoots = [];
    nodeDataList.forEach(nd => {
      nodeMap[nd.key] = { ...nd, children: [], depth: 0, stage: 0, x: 0, y: 0, height: 0 };
    });
    nodeDataList.forEach(nd => {
      if (nd.parent && nodeMap[nd.parent]) nodeMap[nd.parent].children.push(nodeMap[nd.key]);
      else if (!nd.parent) incomeRoots.push(nodeMap[nd.key]);
    });
  }

  function computeValues() {
    function walk(node) {
      if (node.children.length === 0) return (node.computedValue = node.value || 0);
      return (node.computedValue = node.children.reduce((s, c) => s + walk(c), 0));
    }
    incomeRoots.forEach(walk);
    totalIn = incomeRoots.reduce((s, r) => s + r.computedValue, 0);
  }

  function assignStages() {
    let maxID = 0;
    function findMax(node, d) {
      if (d > maxID) maxID = d;
      node.children.forEach(c => findMax(c, d + 1));
    }
    incomeRoots.forEach(r => findMax(r, 0));
    function setIncStage(node, d) {
      node.stage = maxID - d;
      node.children.forEach(c => setIncStage(c, d + 1));
    }
    incomeRoots.forEach(r => setIncStage(r, 0));
  }

  function computeLayout() {
    allVisibleNodes = [];
    function collect(node) { allVisibleNodes.push(node); node.children.forEach(collect); }
    incomeRoots.forEach(collect);

    const stages = {};
    allVisibleNodes.forEach(n => { if (!stages[n.stage]) stages[n.stage] = []; stages[n.stage].push(n); });
    
    const stageKeys = Object.keys(stages).map(Number).sort((a, b) => a - b);
    const maxNodesInStage = Math.max(...stageKeys.map(k => stages[k].length));
    
    const targetAvailH = Math.max(160, maxNodesInStage * 28 + (maxNodesInStage - 1) * NODE_GAP);
    SVG_H = PAD.top + PAD.bottom + targetAvailH;

    const availH = SVG_H - PAD.top - PAD.bottom;
    const maxTotal = Math.max(...stageKeys.map(sk => stages[sk].reduce((s, n) => s + (n.computedValue || 0), 0)));
    const scaleH = (availH - (maxNodesInStage - 1) * NODE_GAP) / (maxTotal || 1);
    
    const availW = SVG_W - PAD.left - PAD.right - 14;
    const stageSpacing = stageKeys.length > 1 ? availW / (stageKeys.length - 1) : 0;

    stageKeys.forEach((sk, i) => {
      const nodes = stages[sk];
      const x = PAD.left + i * stageSpacing;
      let y = PAD.top + (availH - nodes.reduce((s, n) => s + Math.max(2, (n.computedValue || 0) * scaleH), 0) - (nodes.length - 1) * NODE_GAP) / 2;

      nodes.forEach(n => {
        n.x = x; n.y = y; n.width = 14; 
        n.height = Math.max(2, (n.computedValue || 0) * scaleH);
        y += n.height + NODE_GAP;
        n.sourceOffset = 0; n.targetOffset = 0;
      });
    });
  }

  function renderChart() {
    SVG_W = window.innerWidth > 0 ? window.innerWidth - 20 : 392; 
    computeLayout();

    const svg = document.getElementById('sankeyChart');
    svg.setAttribute('viewBox', `0 0 ${SVG_W} ${SVG_H}`);
    let html = '';

    const conns = [];
    function addEdges(node) {
      node.children.forEach(child => {
        const src = child.stage < node.stage ? child : node, tgt = child.stage < node.stage ? node : child;
        conns.push({ source: src, target: tgt, value: child.computedValue || 0 });
        addEdges(child);
      });
    }
    incomeRoots.forEach(addEdges);
    
    conns.sort((a, b) => a.source.key !== b.source.key ? a.source.y - b.source.y : a.target.y - b.target.y);
    conns.forEach(c => {
      const srcNode = c.source, tgtNode = c.target;
      const sh = (c.value / (srcNode.computedValue || 1)) * srcNode.height;
      const th = (c.value / (tgtNode.computedValue || 1)) * tgtNode.height;
      const sy = srcNode.y + srcNode.sourceOffset, ty = tgtNode.y + tgtNode.targetOffset;
      srcNode.sourceOffset += sh; tgtNode.targetOffset += th;
      
      const sx = srcNode.x + srcNode.width, tx = tgtNode.x, midX = (sx + tx) / 2;
      const d = `M ${sx},${sy} C ${midX},${sy} ${midX},${ty} ${tx},${ty} L ${tx},${ty + th} C ${midX},${ty + th} ${midX},${sy + sh} ${sx},${sy + sh} Z`;
      html += `<path d="${d}" fill="${getComputedColor(tgtNode.colorVar || '--chart-1')}" opacity="${FLOW_OPACITY}"/>`;
    });

    allVisibleNodes.forEach(n => {
      html += `<rect x="${n.x}" y="${n.y}" width="${n.width}" height="${n.height}" rx="3" ry="3" fill="${getComputedColor(n.colorVar)}"/>`;
      
      const cy = n.y + n.height / 2 - 6;
      const LABEL_STYLE = `font-family:var(--ff-sans);font-size:10.5px;font-weight:500;line-height:1.2;color:var(--on-surface-default);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;`;
      
      if (n.stage === 0) {
        html += `<foreignObject x="${n.x - PAD.left + 5}" y="${cy}" width="${PAD.left - 12}" height="30">
          <div xmlns="http://www.w3.org/1999/xhtml" style="${LABEL_STYLE}text-align:left;">${n.label}</div></foreignObject>`;
      }
    });
    svg.innerHTML = html;
  }

  function renderSliders() {
    const container = document.getElementById('slidersContainer');
    let html = '';
    nodeDataList.forEach(n => {
      if (!n.slider) return;
      html += `
        <div class="slider-row">
          <div class="slider-label">
            <span class="color-dot" style="background-color: var(${n.colorVar})"></span>${n.label}
          </div>
          <div class="slider-control">
            <input type="range" min="${n.slider.min}" max="${n.slider.max}" step="${n.slider.step}" value="${n.value}" data-node="${n.key}" oninput="handleSlider(this)">
            <input type="text" class="slider-value" data-display="${n.key}" value="${fmt(n.value)}" readonly>
          </div>
        </div>`;
    });
    container.innerHTML = html;
    document.querySelectorAll('input[type="range"]').forEach(updateSliderProgress);
  }

  window.handleSlider = function(el) {
    const val = parseInt(el.value) || 0;
    updateSliderProgress(el);
    document.querySelector(`[data-display="${el.dataset.node}"]`).value = fmt(val);
    nodeMap[el.dataset.node].value = val;
    computeValues(); renderChart();
    document.getElementById('heroValue').textContent = fmt(totalIn);
  };

  window.addEventListener('resize', () => { renderChart(); });
  
  buildTree();
  computeValues();
  assignStages();
  renderSliders();
  renderChart();
  document.getElementById('heroValue').textContent = fmt(totalIn);
</script>
</body>
</html>
